<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Name | Software Engineer Portfolio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #e2e8f0;
            --accent-color: #38bdf8;
            --card-bg: #1e293b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            margin: 0;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 40px;
            border-bottom: 1px solid #334155;
            padding-bottom: 20px;
        }
        h1 { margin: 0 0 10px 0; color: #fff; }
        .subtitle { font-size: 1.2rem; color: var(--accent-color); margin-top: 0; }
        .links a {
            color: var(--text-color);
            margin-right: 15px;
            text-decoration: none;
            font-weight: 500;
        }
        .links a:hover { color: var(--accent-color); }
        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        @media(min-width: 600px) { .grid { grid-template-columns: 1fr 1fr; } }
        .card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .card h3 { margin-top: 0; color: #fff; }
        .tech-tag {
            display: inline-block;
            background: #334155;
            color: var(--accent-color);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            margin-right: 5px;
            margin-top: 5px;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            margin-right: 10px;
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
        }
        .btn:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Ben Usnick</h1>
            <p class="subtitle">Computer Science Graduate with focus in Software Engineering</p>
            <div class="links">
                <a href="https://github.com/bausnick" target="_blank">🐙 GitHub</a>
                <a href="mailto:bausnick@gmail.com">✉️ Email</a>
            </div>
        </header>

        <section>
            <h2>About Me</h2>
            <p>FIX ME.</p>
        </section>

        <section>
            <h2>Featured Projects</h2>
            <div class="grid">
                <!-- Project 1 -->
                <div class="card">
                    <h3>Appointment Book</h3>
                    <p>Explaination.</p>
                    <div>
                        <span class="tech-tag">Java</span>
                        <span class="tech-tag">MVVM</span>
                        <span class="tech-tag">SQLite</span>
                    </div>
                    <a href="#" class="btn">View Code →</a>
                    <a href="#" class="btn">Live Demo ↗</a>
                </div>

                <!-- Project 2 -->
                <div class="card">
                    <h3>Full Stack Webpage</h3>
                    <p>Explaination.</p>
                    <div>
                        <span class="tech-tag">Java</span>
                        <span class="tech-tag">Spring Boot</span>
                        <span class="tech-tag">Docker</span>
                    </div>
                    <a href="#" class="btn">View Code →</a>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
